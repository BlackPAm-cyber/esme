

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shoe Store</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #222;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .shoe {
            background: white;
            padding: 15px;
            border-radius: 10px;
            width: 250px;
            box-shadow: 0 2px 8px #ccc;
        }

        .shoe img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>WELCOME TO MY SHOE STORE 👟</h1>
    <p>Find your favorite shoes here!</p>

    <div class="container">

        <div class="shoe">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="Red sneakers">
            <h3>Red Sneakers</h3>
            <p>Price: ₱1,500</p>
            <button>Buy Now</button>
        </div>

        <div class="shoe">
            <img src="https://images.unsplash.com/photo-1549298916-b41d501d3772?w=500" alt="Casual shoes">
            <h3>Casual Shoes</h3>
            <p>Price: ₱1,800</p>
            <button>Buy Now</button>
        </div>

        <div class="shoe">
            <img src="https://images.unsplash.com/photo-1460353581641-37baddab0fa2?w=500" alt="Sports shoes">
            <h3>Sports Shoes</h3>
            <p>Price: ₱2,000</p>
            <button>Buy Now</button>
        </div>

        <div class="shoe">
            <img src="https://images.unsplash.com/photo-1495555961986-6d4c1ecb7be3?w=500" alt="Fashion shoes">
            <h3>Fashion Shoes</h3>
            <p>Price: ₱1,200</p>
            <button>Buy Now</button>
        </div>

        <div class="shoe">
            <img src="https://images.unsplash.com/photo-1552346154-21d32810aba3?w=500" alt="White sneakers">
            <h3>White Sneakers</h3>
            <p>Price: ₱2,500</p>
            <button>Buy Now</button>
        </div>

        <div class="shoe">
            <img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?w=500" alt="Running shoes">
            <h3>Running Shoes</h3>
            <p>Price: ₱1,700</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>

</html>
